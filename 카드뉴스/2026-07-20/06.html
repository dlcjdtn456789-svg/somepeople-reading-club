<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1350px;background:#F3EEE3;font-family:'Noto Serif KR',serif;color:#2B2620;position:relative;overflow:hidden;}
.wordmark{position:absolute;top:64px;left:64px;font-size:19px;letter-spacing:4px;color:#8C8272;font-weight:500;}
.page-num{position:absolute;bottom:56px;right:64px;font-size:18px;letter-spacing:2px;color:#8C8272;}
.center{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 96px;}
.line1{font-size:34px;font-weight:500;color:#B5673A;margin-bottom:52px;}
.rule{width:64px;height:2px;background:#B5673A;margin-bottom:52px;}
.big{font-size:38px;font-weight:400;line-height:1.7;color:#4A4438;}
</style></head>
<body>
<div class="wordmark">SOMEPEOPLE READING CLUB</div>
<div class="center">
  <div class="line1">부담 갖지 마세요</div>
  <div class="rule"></div>
  <div class="big">긴 글도, 무거운 주제도 아닙니다<br>가볍게 들고 나가<br>가볍게 건넬 수 있는 책이면 충분합니다</div>
</div>
<div class="page-num">06 / 07</div>
</body></html>
