<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1350px;background:#2B2620;font-family:'Noto Serif KR',serif;color:#F3EEE3;position:relative;overflow:hidden;}
.wordmark{position:absolute;top:64px;left:64px;font-size:19px;letter-spacing:4px;color:#B5A79A;font-weight:500;}
.page-num{position:absolute;bottom:56px;right:64px;font-size:18px;letter-spacing:2px;color:#B5A79A;}
.center{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 96px;}
.icon{font-size:60px;margin-bottom:36px;}
.heading{font-size:48px;font-weight:700;margin-bottom:44px;line-height:1.4;}
.sub{font-size:30px;font-weight:400;color:#D9CFC0;line-height:1.6;margin-bottom:64px;}
.handle{font-size:32px;font-weight:600;letter-spacing:1px;color:#F3EEE3;border:1.5px solid #B5673A;padding:20px 44px;border-radius:40px;}
</style></head>
<body>
<div class="wordmark">SOMEPEOPLE READING CLUB</div>
<div class="center">
  <div class="icon">🌾</div>
  <div class="heading">기록은,<br>결국 연결입니다</div>
  <div class="sub">당신의 문장을 기다립니다</div>
  <div class="handle">@somepeople_rc</div>
</div>
<div class="page-num">07 / 07</div>
</body></html>
