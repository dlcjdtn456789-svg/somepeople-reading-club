<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1350px;background:#F3EEE3;font-family:'Noto Serif KR',serif;color:#2B2620;position:relative;overflow:hidden;}
.wordmark{position:absolute;top:64px;left:64px;font-size:19px;letter-spacing:4px;color:#8C8272;font-weight:500;}
.page-num{position:absolute;bottom:56px;right:64px;font-size:18px;letter-spacing:2px;color:#8C8272;}
.center{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 100px;}
.title{font-size:92px;font-weight:700;line-height:1.2;letter-spacing:1px;}
.rule{width:64px;height:2px;background:#B5673A;margin:44px 0;}
.subtitle{font-size:34px;font-weight:500;color:#4A4438;letter-spacing:1px;line-height:1.6;}
.ko{position:absolute;bottom:110px;left:0;width:100%;text-align:center;font-size:22px;letter-spacing:6px;color:#8C8272;font-weight:500;}
</style></head>
<body>
<div class="wordmark">SOMEPEOPLE READING CLUB</div>
<div class="center">
  <div class="title">somepeople<br>reading club</div>
  <div class="rule"></div>
  <div class="subtitle">같은 순간, 같은 공간, 같은 책</div>
</div>
<div class="ko">썸 &nbsp; 피 &nbsp; 플 &nbsp; 리 &nbsp; 딩 &nbsp; 클 &nbsp; 럽</div>
<div class="page-num">01 / 07</div>
</body></html>
