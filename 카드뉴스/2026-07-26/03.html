<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1350px;background:#F3EEE3;font-family:'Noto Serif KR',serif;color:#2B2620;position:relative;overflow:hidden;}
.wordmark{position:absolute;top:64px;left:64px;font-size:19px;letter-spacing:4px;color:#8C8272;font-weight:500;}
.page-num{position:absolute;bottom:56px;right:64px;font-size:18px;letter-spacing:2px;color:#8C8272;}
.wrap{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 96px;}
.label{font-size:19px;letter-spacing:4px;color:#B5673A;font-weight:600;margin-bottom:22px;}
.heading{font-size:48px;font-weight:700;margin-bottom:64px;}
.item{display:flex;align-items:flex-start;margin-bottom:44px;}
.num{font-size:34px;font-weight:700;color:#B5673A;width:80px;flex-shrink:0;}
.desc{font-size:29px;font-weight:400;line-height:1.5;padding-top:2px;}
</style></head>
<body>
<div class="wordmark">SOMEPEOPLE READING CLUB</div>
<div class="wrap">
  <div class="label">OUR STORY SO FAR</div>
  <div class="heading">지금까지의 여정</div>
  <div class="item"><div class="num">01</div><div class="desc">같은 순간, 같은 공간을<br>스쳐 지나가는 사람들</div></div>
  <div class="item"><div class="num">02</div><div class="desc">somepeople,<br>이름 없이도 이어지는 연결</div></div>
  <div class="item"><div class="num">03</div><div class="desc">책이라는<br>가장 조용한 매개체</div></div>
  <div class="item"><div class="num">04</div><div class="desc">기록으로 남는<br>감정, 남는 순간</div></div>
</div>
<div class="page-num">03 / 07</div>
</body></html>
